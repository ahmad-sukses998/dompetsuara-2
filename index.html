<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetSuara - Ringan & Stabil</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 5px;
            color: var(--primary);
        }
        .sub {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-mic {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background-color: var(--primary);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .btn-mic.listening {
            background-color: var(--danger);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .status {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        select { width: 100%; }
        .btn-save {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .history-section h3 {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-top: 20px;
            font-size: 16px;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .item-info {
            display: flex;
            flex-direction: column;
        }
        .item-info .desc {
            font-weight: 500;
            font-size: 15px;
        }
        .item-info .tag {
            font-size: 11px;
            color: #64748b;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
            margin-top: 4px;
        }
        .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .item-actions .amount {
            color: var(--danger);
            font-weight: 600;
            font-size: 15px;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-delete:hover {
            color: var(--danger);
        }
        .total-box {
            margin-top: 15px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ DompetSuara</h1>
    <div class="sub">Ucapkan contoh: <b>"Makan bakso 25 ribu"</b></div>

    <div class="voice-section">
        <button id="micBtn" class="btn-mic">🎙️</button>
        <div id="statusText" class="status">Ketuk mikrofon untuk mulai bicara</div>
    </div>

    <div class="form-group">
        <div class="input-row">
            <input type="text" id="prodDesc" placeholder="Keterangan pengeluaran">
            <input type="number" id="prodAmount" placeholder="Nominal (Rp)">
        </div>
        <select id="prodCategory">
            <option value="Makanan">Makanan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Kebutuhan Rumah">Kebutuhan Rumah</option>
            <option value="Lainnya">Lainnya</option>
        </select>
        <button id="saveBtn" class="btn-save">Simpan Pengeluaran</button>
    </div>

    <div class="history-section">
        <h3>Riwayat Transaksi</h3>
        <div id="expenseList"></div>
        <div class="total-box">
            <span>Total Pengeluaran:</span>
            <span id="totalAmount">Rp 0</span>
        </div>
    </div>
</div>

<script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var dataPengeluaran = JSON.parse(localStorage.getItem('pengeluaran_simple_voice')) || [];

    var micBtn = document.getElementById('micBtn');
    var statusText = document.getElementById('statusText');
    var prodDesc = document.getElementById('prodDesc');
    var prodAmount = document.getElementById('prodAmount');
    var prodCategory = document.getElementById('prodCategory');
    var saveBtn = document.getElementById('saveBtn');
    var expenseList = document.getElementById('expenseList');
    var totalAmount = document.getElementById('totalAmount');

    var kamusKategori = {
        'Makanan': ['makan', 'minum', 'kopi', 'bakso', 'nasi', 'camilan', 'snack', 'warung', 'restoran'],
        'Transportasi': ['bensin', 'parkir', 'ojek', 'grab', 'gojek', 'bus', 'kereta', 'tol', 'motor', 'mobil'],
        'Hiburan': ['nonton', 'bioskop', 'game', 'topup', 'netflix', 'jalan', 'wisata'],
        'Kebutuhan Rumah': ['listrik', 'air', 'pdam', 'sabun', 'token', 'wifi', 'internet', 'kontrakan']
    };

    function deteksiKategori(teks) {
        var teksLower = teks.toLowerCase();
        for (var kategori in kamusKategori) {
            var kataKunci = kamusKategori[kategori];
            for (var i = 0; i < kataKunci.length; i++) {
                if (teksLower.indexOf(kataKunci[i]) !== -1) {
                    return kategori;
                }
            }
        }
        return 'Lainnya';
    }

    function updateUI() {
        expenseList.innerHTML = '';
        var total = 0;
        dataPengeluaran.forEach(function(item, index) {
            total += item.nominal;
            var div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = '<div class="item-info"><span class="desc">' + item.keterangan + '</span><span class="tag">' + item.kategori + '</span></div><div class="item-actions"><span class="amount">- Rp ' + item.nominal.toLocaleString('id-ID') + '</span><button class="btn-delete" onclick="hapusItem(' + index + ')">🗑️</button></div>';
            expenseList.appendChild(div);
        });
        totalAmount.innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    if (!SpeechRecognition) {
        statusText.innerText = "❌ Browser Anda tidak mendukung input suara.";
    } else {
        var recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.interimResults = false;

        micBtn.addEventListener('click', function() {
            try {
                recognition.start();
            } catch(e) {
                console.log("Perekaman sudah berjalan.");
            }
        });

        recognition.onstart = function() {
            micBtn.classList.add('listening');
            statusText.innerText = "Mendengarkan... Silakan bicara.";
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
        };

        recognition.onresult = function(event) {
            var hasilTeks = event.results[0][0].transcript;
            var teksClean = hasilTeks.toLowerCase()
                .replace(/ribu/g, '000')
                .replace(/ratus/g, '00')
                .replace(/juta/g, '000000')
                .replace(/\./g, '')
                .replace(/,/g, '');

            var angkaCocok = teksClean.match(/\d+/);
            var nominal = angkaCocok ? parseInt(angkaCocok[0]) : 0;
            var keterangan = hasilTeks.replace(new RegExp(angkaCocok ? angkaCocok[0] : "", 'g'), '')
                                      .replace(/ribu|ratus|juta/gi, '')
                                      .replace(/\s+/g, ' ')
                                      .trim();

            if (!keterangan) keterangan = "Pengeluaran Suara";

            prodDesc.value = keterangan;
prodAmount.value = nominal;
prodCategory.value = deteksiKategori(keterangan);
statusText.innerText = "🎙️ Suara diterima! Periksa input lalu klik Simpan.";
};
recognition.onerror = function() {
micBtn.classList.remove('listening');
statusText.innerText = "❌ Akses mic diblokir atau error. Gunakan HTTPS (GitHub Pages).";
};
}
saveBtn.addEventListener('click', function() {
var keterangan = prodDesc.value.trim();
var nominal = parseInt(prodAmount.value);
var kategori = prodCategory.value;
if (!keterangan || isNaN(nominal) || nominal <= 0) {
alert("Harap isi keterangan dan nominal uang dengan benar!");
return;
}
dataPengeluaran.push({ keterangan: keterangan, nominal: nominal, kategori: kategori });
localStorage.setItem('pengeluaran_simple_voice', JSON.stringify(dataPengeluaran));
prodDesc.value = '';
prodAmount.value = '';
statusText.innerText = "Ketuk mikrofon untuk mulai bicara";
updateUI();
});
window.hapusItem = function(index) {
dataPengeluaran.splice(index, 1);
localStorage.setItem('pengeluaran_simple_voice', JSON.stringify(dataPengeluaran));
updateUI();
};
updateUI();
