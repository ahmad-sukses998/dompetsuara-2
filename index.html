<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Browser Anda tidak mendukung Voice Recognition. Gunakan Chrome (Android) atau Safari/Chrome (iOS).");
    } else {
        const recognition = new SpeechRecognition();
        
        // --- PENYESUAIAN KHUSUS HP ---
        recognition.lang = 'id-ID';
        recognition.continuous = false; // HP bekerja lebih stabil dalam mode sekali ucap
        recognition.interimResults = true; // Menampilkan hasil sementara agar pengguna tahu HP sedang merekam
        recognition.maxAlternatives = 1;

        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const previewText = document.getElementById('previewText');
        const expenseList = document.getElementById('expenseList');
        const totalAmount = document.getElementById('totalAmount');

        let dataPengeluaran = JSON.parse(localStorage.getItem('pengeluaran_harian')) || [];
        let finalTranscript = '';
        let isListening = false;

        function updateUI() {
            expenseList.innerHTML = '';
            let total = 0;
            
            dataPengeluaran.forEach((item) => {
                total += item.nominal;
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span class="desc">${item.keterangan}</span>
                    <span class="amount">- Rp ${item.nominal.toLocaleString('id-ID')}</span>
                `;
                expenseList.appendChild(div);
            });

            totalAmount.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function prosesTeks(teks) {
            if (!teks.trim()) return;

            // Konversi sebutan nominal angka ke bentuk digit
            let teksClean = teks.toLowerCase()
                .replace(/ribu/g, '000')
                .replace(/ratus/g, '00')
                .replace(/juta/g, '000000')
                .replace(/\./g, '')
                .replace(/,/g, '');

            const angkaCocok = teksClean.match(/\d+/);
            
            if (!angkaCocok) {
                statusText.innerText = "❌ Nominal tidak terdeteksi. Coba katakan: 'Makan 20 ribu'";
                return;
            }

            const nominal = parseInt(angkaCocok[0]);
            
            let keterangan = teks.replace(new RegExp(angkaCocok[0], 'g'), '')
                                  .replace(/ribu|ratus|juta/gi, '')
                                  .replace(/\s+/g, ' ')
                                  .trim();

            if (!keterangan) keterangan = "Pengeluaran Tanpa Nama";

            dataPengeluaran.push({ keterangan, nominal });
            localStorage.setItem('pengeluaran_harian', JSON.stringify(dataPengeluaran));
            
            statusText.innerText = `✅ Tersimpan: ${keterangan} (Rp${nominal.toLocaleString('id-ID')})`;
            updateUI();
        }

        // Toggle On/Off Mikrofon (Aman untuk Touch Screen HP)
        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                finalTranscript = '';
                previewText.innerText = 'Mendengarkan...';
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.innerText = "Mendengarkan... Silakan bicara.";
        };

        recognition.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            // Tampilkan teks langsung saat pengguna sedang bicara
            previewText.innerText = `"${finalTranscript || interim}"`;
        };

        recognition.onspeechend = () => {
            recognition.stop();
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            if (finalTranscript) {
                prosesTeks(finalTranscript);
            }
        };

        recognition.onerror = (event) => {
            isListening = false;
            micBtn.classList.remove('listening');
            if (event.error === 'not-allowed') {
                statusText.innerText = "❌ Akses mikrofon ditolak. Izinkan mic di pengaturan HP.";
            } else if (event.error === 'no-speech') {
                statusText.innerText = "❌ Tidak ada suara terdeteksi. Coba lagi.";
            } else {
                statusText.innerText = "❌ Gangguan koneksi/mikrofon.";
            }
        };

        updateUI();
    }
</script>
