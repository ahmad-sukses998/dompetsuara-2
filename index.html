<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetAI - Catatan Keuangan Lengkap</title>
    <!-- Chart.js CDN untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; color: var(--primary); }
        .sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 20px; }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-card {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            background: #f1f5f9;
        }

        .summary-card .label { font-size: 11px; color: #64748b; font-weight: 600; }
        .summary-card .value { font-size: 13px; font-weight: bold; margin-top: 4px; }
        .val-in { color: var(--success); }
        .val-out { color: var(--danger); }
        .val-balance { color: var(--primary); }

        /* Input Controls */
        .type-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .type-btn.active[data-type="out"] {
            border-color: var(--danger);
            background: #fef2f2;
            color: var(--danger);
        }

        .type-btn.active[data-type="in"] {
            border-color: var(--success);
            background: #f0fdf4;
            color: var(--success);
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .btn-add {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .status { 
            font-size: 12px;
            font-weight: 500; 
            min-height: 18px; 
            margin-bottom: 20px;
            color: #64748b;
        }

        /* Chart */
        .chart-box {
            margin: 15px 0 25px 0;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 220px;
            height: 220px;
        }

        /* History List */
        .history-section h3 { 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 8px; 
            margin-top: 10px;
            font-size: 16px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .list-item .desc { font-weight: 600; font-size: 14px; display: block; }
        .list-item .meta-info {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .list-item .category-tag {
            background: #e2e8f0;
            color: #475569;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 500;
        }

        .list-item .amount { font-weight: 700; font-size: 14px; }
        .list-item .amount.out { color: var(--danger); }
        .list-item .amount.in { color: var(--success); }

        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 15px;
            margin-left: 8px;
        }

        .btn-delete:hover {
            color: var(--danger);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 DompetAI</h1>
    <div class="sub">Ketik misal: <b>"Gaji 5 juta"</b> atau <b>"Makan bakso 20rb"</b></div>

    <!-- Summary Box -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">PEMASUKAN</div>
            <div id="totalIn" class="value val-in">Rp 0</div>
        </div>
        <div class="summary-card">
            <div class="label">PENGELUARAN</div>
            <div id="totalOut" class="value val-out">Rp 0</div>
        </div>
        <div class="summary-card">
            <div class="label">SISA SALDO</div>
            <div id="totalBalance" class="value val-balance">Rp 0</div>
        </div>
    </div>

    <!-- Toggle Pemasukan / Pengeluaran -->
    <div class="type-toggle">
        <button class="type-btn active" data-type="out" id="btnTypeOut">🔴 Pengeluaran</button>
        <button class="type-btn" data-type="in" id="btnTypeIn">🟢 Pemasukan</button>
    </div>

    <div class="input-section">
        <input type="text" id="expenseInput" class="input-field" placeholder="Ketik keterangan & nominal..." />
        <button id="addBtn" class="btn-add">Tambah</button>
    </div>
    
    <div id="statusText" class="status">Ketik kalimat transaksi lalu tekan Tambah.</div>

    <!-- Grafik -->
    <div class="chart-box">
        <span style="font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #475569;">📊 Distribusi Pengeluaran</span>
        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="history-section">
        <h3>Riwayat Transaksi</h3>
        <div id="expenseList"></div>
    </div>
</div>

<script>
    const expenseInput = document.getElementById('expenseInput');
    const addBtn = document.getElementById('addBtn');
    const statusText = document.getElementById('statusText');
    const expenseList = document.getElementById('expenseList');
    
    const totalInEl = document.getElementById('totalIn');
    const totalOutEl = document.getElementById('totalOut');
    const totalBalanceEl = document.getElementById('totalBalance');

    const btnTypeOut = document.getElementById('btnTypeOut');
    const btnTypeIn = document.getElementById('btnTypeIn');

    let currentType = 'out'; // 'out' = pengeluaran, 'in' = pemasukan
    let dataTransaksi = JSON.parse(localStorage.getItem('dompet_ai_v2')) || [];
    let myChart = null;

    // Kata kunci Pemasukan
    const incomeKeywords = ["gaji", "bonus", "transfer", "dapat", "terima", "omzet", "penjualan", "sampingan", "komisi", "hadiah", "thr"];

    // Kata kunci Kategori Pengeluaran
    const categoryKeywords = {
        "Makanan & Minuman": ["makan", "minum", "bakso", "nasi", "kopi", "teh", "roti", "snack", "resto", "warung", "jus", "ayam", "sate", "soto", "sarapan", "siang", "malam", "kafe", "piza", "burger"],
        "Transportasi": ["bensin", "parkir", "gojek", "grab", "e-toll", "toll", "angkot", "bus", "kereta", "tiket", "ojek", "pertalite", "pertamax", "servis", "tambal"],
        "Belanja": ["baju", "celana", "sepatu", "tas", "sabun", "sampo", "supermarket", "indomaret", "alfamart", "skincare", "kosmetik", "tokopedia", "shopee"],
        "Tagihan & Listrik": ["listrik", "air", "pdam", "pulsa", "kuota", "wifi", "indihome", "sewa", "kos", "kontrakan", "pajak", "asuransi", "cicilan"],
        "Hiburan": ["nonton", "bioskop", "game", "topup", "spotify", "netflix", "jalan", "liburan", "wisata"]
    };

    // Handler Toggle Tipe
    btnTypeOut.addEventListener('click', () => setType('out'));
    btnTypeIn.addEventListener('click', () => setType('in'));

    function setType(type) {
        currentType = type;
        if (type === 'out') {
            btnTypeOut.classList.add('active');
            btnTypeIn.classList.remove('active');
        } else {
            btnTypeIn.classList.add('active');
            btnTypeOut.classList.remove('active');
        }
    }

    function tebakKategori(teks) {
        const teksLower = teks.toLowerCase();
        for (const [kategori, kataKunci] of Object.entries(categoryKeywords)) {
            if (kataKunci.some(keyword => teksLower.includes(keyword))) {
                return kategori;
            }
        }
        return "Lainnya";
    }

    function renderChart() {
        const categoryTotals = {};
        
        // Filter hanya pengeluaran untuk grafik kategori
        dataTransaksi.filter(item => item.tipe === 'out').forEach(item => {
            categoryTotals[item.kategori] = (categoryTotals[item.kategori] || 0) + item.nominal;
        });

        const labels = Object.keys(categoryTotals);
        const dataValues = Object.values(categoryTotals);
        const ctx = document.getElementById('expenseChart').getContext('2d');

        if (myChart) myChart.destroy();

        if (labels.length === 0) return;

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#64748b'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 10, font: { size: 10 } }
                    }
                }
            }
        });
    }

    function updateUI() {
        expenseList.innerHTML = '';
        let totalIn = 0;
        let totalOut = 0;

        if (dataTransaksi.length === 0) {
            expenseList.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 15px 0; font-size: 13px;">Belum ada catatan transaksi.</div>';
        } else {
            // Urutkan dari transaksi terbaru di atas
            dataTransaksi.slice().reverse().forEach((item, indexFromReverse) => {
                const originalIndex = dataTransaksi.length - 1 - indexFromReverse;
                
                if (item.tipe === 'in') {
                    totalIn += item.nominal;
                } else {
                    totalOut += item.nominal;
                }

                const isOut = item.tipe === 'out';
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <span class="desc">${item.keterangan}</span>
                        <div class="meta-info">
                            <span>${item.waktu}</span>
                            ${isOut ? `<span class="category-tag">${item.kategori}</span>` : `<span class="category-tag" style="background:#dcfce7; color:#15803d;">Pemasukan</span>`}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span class="amount ${isOut ? 'out' : 'in'}">
                            ${isOut ? '-' : '+'} Rp ${item.nominal.toLocaleString('id-ID')}
                        </span>
                        <button class="btn-delete" onclick="hapusTransaksi(${originalIndex})">✕</button>
                    </div>
                `;
                expenseList.appendChild(div);
            });
        }

        // Rekapitulasi Total
        totalInEl.innerText = `Rp ${totalIn.toLocaleString('id-ID')}`;
        totalOutEl.innerText = `Rp ${totalOut.toLocaleString('id-ID')}`;
        
        const balance = totalIn - totalOut;
        totalBalanceEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
        totalBalanceEl.className = `value ${balance < 0 ? 'val-out' : 'val-balance'}`;

        renderChart();
    }

    function prosesTeks(teks) {
        if (!teks.trim()) return;

        let teksLower = teks.toLowerCase();

        // 1. Deteksi Tipe Otomatis dari Kata Kunci jika belum sengaja diubah manual
        let tipeTransaksi = currentType;
        if (incomeKeywords.some(kw => teksLower.includes(kw))) {
            tipeTransaksi = 'in';
        }

        // 2. Format & Parse Angka
        let teksClean = teksLower
            .replace(/ribu|rb/g, '000')
            .replace(/ratus/g, '00')
            .replace(/juta|jt/g, '000000')
            .replace(/\./g, '')
            .replace(/,/g, '');

        const angkaCocok = teksClean.match(/\d+/);

        if (!angkaCocok) {
            statusText.style.color = "#dc2626";
            statusText.innerText = "❌ Nominal angka tidak ditemukan. Contoh: 'Gaji 3jt' atau 'Bakso 15rb'";
            return;
        }

        const nominal = parseInt(angkaCocok[0]);

        // 3. Ekstrak Keterangan
        let keterangan = teks.replace(new RegExp(angkaCocok[0], 'g'), '')
                              .replace(/ribu|rb|ratus|juta|jt/gi, '')
                              .replace(/\s+/g, ' ')
                              .trim();

        if (!keterangan) keterangan = tipeTransaksi === 'in' ? "Pemasukan Tanpa Nama" : "Pengeluaran Tanpa Nama";

        // 4. Ambil Tanggal dan Jam Saat Ini
        const sekarang = new Date();
        const opsiTanggal = { day: '2-digit', month: 'short', year: 'numeric' };
        const opsiWaktu = { hour: '2-digit', minute: '2-digit', hour12: false };
        const tanggalStr = sekarang.toLocaleDateString('id-ID', opsiTanggal);
        const waktuStr = sekarang.toLocaleTimeString('id-ID', opsiWaktu);
        const waktuLengkap = `${tanggalStr}, ${waktuStr}`;

        // 5. Kategori AI (Khusus Pengeluaran)
        const kategori = tipeTransaksi === 'out' ? tebakKategori(keterangan) : 'Pemasukan';

        // 6. Simpan Data
        dataTransaksi.push({
            keterangan,
            nominal,
            tipe: tipeTransaksi,
            kategori,
            waktu: waktuLengkap
        });

        localStorage.setItem('dompet_ai_v2', JSON.stringify(dataTransaksi));

        statusText.style.color = tipeTransaksi === 'in' ? "#16a34a" : "#2563eb";
        statusText.innerText = `✅ Tersimpan (${tipeTransaksi === 'in' ? 'Pemasukan' : 'Pengeluaran'}): ${keterangan} - Rp ${nominal.toLocaleString('id-ID')}`;
        
        expenseInput.value = '';
        setType('out'); // Reset toggle ke default pengeluaran
        updateUI();
    }

    function hapusTransaksi(index) {
        dataTransaksi.splice(index, 1);
        localStorage.setItem('dompet_ai_v2', JSON.stringify(dataTransaksi));
        statusText.style.color = "#64748b";
        statusText.innerText = "🗑️ Transaksi berhasil dihapus.";
        updateUI();
    }

    addBtn.addEventListener('click', () => prosesTeks(expenseInput.value));
    
    expenseInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            prosesTeks(expenseInput.value);
        }
    });

    updateUI();
</script>

</body>
</html>
